[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visagecam"
version = "1.6.0"
description = "Camara virtual para Windows con mascaras faciales, accesorios, filtros de belleza y fondos"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "Skain" }]
license = { file = "LICENSE" }
classifiers = [
    "License :: Other/Proprietary License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy>=1.26,<2",
    "opencv-contrib-python>=4.9",
    "mediapipe>=0.10.14,<0.10.30",
    "PySide6>=6.6",
    "pyvirtualcam>=0.11",
    "websocket-client>=1.7",
    "Pillow>=10.0",
    "pygrabber>=0.2; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "websockets>=12.0",
]

[project.gui-scripts]
visagecam = "visagecam.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
visagecam = ["assets/*"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["visagecam"]
